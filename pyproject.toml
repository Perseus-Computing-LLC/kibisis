[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kibisis"
version = "0.1.0a9"
description = "Local-first encrypted cognitive memory vault with atomic concurrency leases."
readme = "README.md"
authors = [
    { name = "Perseus Computing LLC", email = "contact@perseuscomputing.com" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42",
    "pydantic>=2",
    "sqlcipher3>=0.5",
]

[project.urls]
Homepage = "https://telarch.ai/kibisis"
Documentation = "https://docs.rs/kibisis"
Repository = "https://github.com/Perseus-Computing-LLC/kibisis"

[project.scripts]
kibisis-mcp = "kibisis.mcp_server:run_stdio_server"
kibisis-review = "kibisis.review:main"
kibisis-keygen = "kibisis.keys:main"

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
pythonpath = ["src"]
testpaths = ["tests"]

