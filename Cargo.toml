[package]
name = "kibisis"
version = "0.1.0-alpha.2"
edition = "2021"
authors = ["Perseus Computing LLC <contact@perseuscomputing.com>"]
description = "Local-first encrypted cognitive memory vault with atomic concurrency leases."
license = "MIT"
repository = "https://github.com/Perseus-Computing-LLC/kibisis"
readme = "README.md"
keywords = ["ai", "agents", "cognitive", "telarch"]
categories = ["development-tools"]

[dependencies]
rusqlite = { version = "0.31.0", features = ["bundled-sqlcipher"] }
zeroize = { version = "1.9.0", default-features = false, features = ["alloc"] }
