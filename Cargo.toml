[package]
name = "kibisis"
version = "0.1.0-alpha.4"
edition = "2021"
rust-version = "1.85"
authors = ["Perseus Computing LLC <contact@perseuscomputing.com>"]
description = "Local-first encrypted cognitive memory vault with atomic concurrency leases."
