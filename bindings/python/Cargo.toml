[package]
name = "kibisis-native"
version = "0.1.0-alpha.12"
edition = "2021"
rust-version = "1.89"
authors = ["Perseus Computing LLC <contact@perseuscomputing.com>"]
description = "Python extension exposing the kibisis Rust lease coordinator and journal hashing to the kibisis Python package."
license = "MIT"
repository = "https://github.com/Perseus-Computing-LLC/kibisis"
publish = false

[lib]
name = "kibisis_native"
crate-type = ["cdylib"]

[dependencies]
kibisis = { path = "../.." }
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py311"] }
