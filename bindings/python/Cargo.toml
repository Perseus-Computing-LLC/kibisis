[package]
name = "kibisis-native"
version = "0.1.0-alpha.16"
edition = "2021"
rust-version = "1.89"
authors = ["Perseus Computing LLC <contact@perseuscomputing.com>"]
description = "Python extension exposing the kibisis Rust lease coordinator and journal hashing to the kibisis Python package."
license = "MIT"
repository = "https://github.com/Perseus-Computing-LLC/kibisis"
publish = false

[lib]
name = "kibisis_native"
crate-type = ["cdylib", "rlib"]

[features]
# maturin builds with the default; `cargo test --no-default-features` links the crate's own tests
# against the interpreter instead (an extension module has no libpython to link its tests with).
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[dependencies]
kibisis = { path = "../.." }
pyo3 = { version = "0.30", features = ["abi3-py311"] }
