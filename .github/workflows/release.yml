name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release-crates:
    name: Build & Package Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - name: Run verification tests
        run: cargo test --release

      - name: Package crate
        run: cargo package

      - name: Generate CycloneDX SBOM
        run: |
          cargo install cargo-cyclonedx --locked || true
          cargo cyclonedx --format json --output-pattern "sbom" || true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@c074443f1a5fb4a48204b02c2738144058d66047 # v2.2.3
        with:
          subject-path: "target/package/*.crate"
        continue-on-error: true

      - name: Upload release artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: crate-package
          path: target/package/*.crate
