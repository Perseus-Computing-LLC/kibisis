name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-rust-stable:
    name: Rust Stable (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy linter
        run: cargo clippy --all-targets -- -D warnings

      - name: Run unit & doc tests
        run: cargo test --verbose

  test-rust-msrv:
    name: Rust MSRV (1.89)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up MSRV toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89.0"

      - name: Cargo check on MSRV
        run: cargo check --verbose

  test-rust-miri:
    name: Rust Miri (Undefined Behavior Check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Nightly for Miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Run Miri test on lease coordination
        run: cargo miri test --lib -- tests::test_lease_coordination
        continue-on-error: true

  test-python:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic cryptography sqlcipher3 pytest hatchling build

      # Installs the built wheel the way a user would: dependencies resolved from PyPI, no --no-deps.
      - name: Install the wheel with its dependencies in a clean venv
        shell: bash
        run: |
          python -m build --wheel
          python -m venv "$RUNNER_TEMP/smoke"
          PY="$RUNNER_TEMP/smoke/bin/python"
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install dist/*.whl
          "$PY" -c "import platform, sqlcipher3, kibisis; print(platform.system(), platform.machine(), 'kibisis', kibisis.__version__, 'with', sqlcipher3.__name__)"

      - name: Run pytest
        run: |
          pytest tests -v
