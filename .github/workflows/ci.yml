name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-rust-stable:
    name: Rust Stable (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, pinned 2026-10-25
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path bindings/python/Cargo.toml -- --check

      - name: Clippy linter
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy --manifest-path bindings/python/Cargo.toml --all-targets -- -D warnings

      - name: Run unit & doc tests
        run: cargo test --verbose

  test-rust-msrv:
    name: Rust MSRV (1.89)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up MSRV toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, pinned 2026-10-25
        with:
          toolchain: "1.89.0"

      - name: Cargo check on MSRV
        run: cargo check --verbose

  test-rust-miri:
    name: Rust Miri (Undefined Behavior Check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Nightly for Miri
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, pinned 2026-10-25
        with:
          toolchain: nightly
          components: miri

      - name: Run Miri test on lease coordination
        run: cargo miri test --lib -- tests::test_lease_coordination
        continue-on-error: true

  test-python:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic cryptography sqlcipher3 pytest hatchling build maturin

      # K-C: the lease coordinator and the format-3 journal hashes are the crate's; the Python package
      # requires the kibisis_native extension (no fallback), so it is built and installed first.
      - name: Build and install the kibisis_native extension
        run: |
          (cd bindings/python && maturin build --release --locked --out "$RUNNER_TEMP/native-wheel")
          pip install "$RUNNER_TEMP"/native-wheel/*.whl
          python -c "import kibisis_native as n; print('kibisis_native', n.crate_version())"

      # Installs the built wheel the way a user would: dependencies resolved from PyPI, no --no-deps.
      # The native wheel is not on PyPI yet, so it is offered from the local directory with --find-links.
      - name: Install the wheel with its dependencies in a clean venv
        shell: bash
        run: |
          python -m build --wheel
          python -m venv "$RUNNER_TEMP/smoke"
          PY="$RUNNER_TEMP/smoke/bin/python"
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install --find-links "$RUNNER_TEMP/native-wheel" dist/*.whl
          "$PY" -c "import platform, sqlcipher3, kibisis; print(platform.system(), platform.machine(), 'kibisis', kibisis.__version__, 'with', sqlcipher3.__name__)"

      - name: Run pytest
        run: |
          pytest tests -v
